<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="斑斑的呼嚕工坊 Ben's Purr Nook — 喵時光、貓咪健康誌、貓咖與斑斑工作室的入口。">
<title>斑斑的呼嚕工坊 Ben's Purr Nook</title>
<meta name="theme-color" content="#fbf6ef">
<link rel="icon" type="image/jpeg" href="banban-b-192.jpg">
<link rel="apple-touch-icon" href="banban-b-192.jpg">
<style>
:root{
  --bg:#fbf6ef; --card:#ffffff; --ink:#3a2f2a; --muted:#6b5a4f; --muted-soft:#8a7b72; --line:#e6ddd0;
  --accent:#e07a3f; --accent-ink:#b4531a; --honey:#fbe8a6;
  --blue:#0066cc; --blue-soft:#eaf2fb;
  --orange:#ee8a5b; --orange-soft:#fff0e3;
  --cafe:#5a4033; --cafe-soft:#f5ebe0;
  --green:#3f8a6b; --green-soft:#e6f3ec;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --sh-1:0 1px 3px rgba(120,80,40,.10); --sh-2:0 6px 24px rgba(120,80,40,.08); --sh-3:0 14px 36px rgba(120,80,40,.16);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#2a2019; --card:#3a2d23; --ink:#f6e7d4; --muted:#c2a98d; --muted-soft:#a58f77; --line:#4a3a2e;
  --accent:#f09a6e; --accent-ink:#ffc2a0; --blue:#6aaeea; --blue-soft:rgba(61,143,224,.16);
  --orange:#f4a37c; --orange-soft:rgba(240,154,110,.15); --cafe:#d9b79a; --cafe-soft:rgba(217,183,154,.14); --green:#7fcaa6; --green-soft:rgba(127,202,166,.14);
  --sh-1:0 1px 3px rgba(0,0,0,.3); --sh-2:0 6px 24px rgba(0,0,0,.25); --sh-3:0 14px 36px rgba(0,0,0,.35);}}
:root[data-theme=dark]{
  --bg:#2a2019; --card:#3a2d23; --ink:#f6e7d4; --muted:#c2a98d; --muted-soft:#a58f77; --line:#4a3a2e;
  --accent:#f09a6e; --accent-ink:#ffc2a0; --blue:#6aaeea; --blue-soft:rgba(61,143,224,.16);
  --orange:#f4a37c; --orange-soft:rgba(240,154,110,.15); --cafe:#d9b79a; --cafe-soft:rgba(217,183,154,.14); --green:#7fcaa6; --green-soft:rgba(127,202,166,.14);
  --sh-1:0 1px 3px rgba(0,0,0,.3); --sh-2:0 6px 24px rgba(0,0,0,.25); --sh-3:0 14px 36px rgba(0,0,0,.35);}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);
  background-image:radial-gradient(900px 420px at 50% -80px,color-mix(in srgb,var(--honey) 38%,transparent),transparent 70%)}
.theme{position:fixed;top:14px;right:16px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;font:inherit;font-size:13px;padding:6px 14px;cursor:pointer;box-shadow:var(--sh-1)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:56px 20px 24px;text-align:center}
.portrait{width:148px;height:148px;border-radius:50%;margin:0 auto 20px;overflow:hidden;background:var(--honey);border:5px solid var(--card);box-shadow:var(--sh-2),0 0 0 1px var(--line);position:relative}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 44%;display:block}
.halo{position:absolute;left:50%;top:-8px;width:72px;height:18px;margin-left:-36px;border:3px solid #f3c64f;border-radius:50%;opacity:.0}
h1{font-size:38px;line-height:1.25;margin:0 0 4px;letter-spacing:.04em}
.brand-en{margin:0 0 14px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-soft)}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:0 auto 40px;color:var(--muted);font-size:16px}
.blocks{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;text-align:left;max-width:760px;margin:0 auto}
.block{--c:var(--accent);--cs:var(--orange-soft);display:flex;flex-direction:column;min-height:230px;padding:26px 24px 22px;border-radius:24px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh-2);color:inherit;text-decoration:none;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
button.block{font:inherit;text-align:left;width:100%}
.block:hover{transform:translateY(-8px) rotate(-.4deg);box-shadow:var(--sh-3)}
.block:focus-visible{outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.ico{width:48px;height:48px;border-radius:14px;background:var(--cs);color:var(--c);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.block h2{margin:0 0 4px;font-size:22px}
.block .en{font-size:12px;letter-spacing:.14em;color:var(--muted-soft);text-transform:uppercase;margin-bottom:10px}
.block p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--c);font-size:14.5px}
.go i{font-style:normal;transition:transform .18s}
.block:hover .go i{transform:translateX(4px)}
.b-studio{--c:var(--blue);--cs:var(--blue-soft)}
.b-time{--c:var(--orange);--cs:var(--orange-soft)}
.b-cafe{--c:var(--cafe);--cs:var(--cafe-soft)}
.b-diary{--c:var(--green);--cs:var(--green-soft)}
:root:not([data-theme=dark]) .b-time h2+.en+p+.go{color:#c25e26}
dialog{border:1px solid var(--line);border-radius:24px;background:var(--card);color:var(--ink);padding:26px 28px;max-width:440px;width:calc(100% - 40px);box-shadow:var(--sh-3)}
dialog::backdrop{background:rgba(42,32,25,.45)}
dialog h3{margin:0 0 10px;font-size:20px}
dialog ol{margin:0 0 16px;padding-left:20px;color:var(--muted)}
dialog li{margin:6px 0}
dialog button{font:inherit;border:0;border-radius:999px;padding:8px 22px;background:var(--ink);color:var(--bg)}

.hero{display:flex;align-items:center;gap:30px;max-width:760px;margin:0 auto 44px;text-align:left}

<body>
<button class="theme" id="theme">切換深淺色</button>
<main>
  <header class="hero">
    <div class="portrait"><img src="banban-b-512.jpg" alt="斑斑"></div>
    <div class="hero-text">
      <h1><em>斑斑</em>的呼嚕工坊</h1>
      <div class="brand-en">Ben's Purr Nook</div>
      <p class="sub">呼嚕呼嚕，斑斑陪著你。</p>
    </div>
  </header>

  <div class="blocks">
    <button type="button" class="block b-studio" id="studioBtn" aria-haspopup="dialog">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/><path d="M4 12h16"/></svg></div>
      <h2>斑斑工作室</h2><div class="en">Ben's Workroom · 離線版</div>
      <p>檢察小工具。純本機運作，資料不上傳，從自己的電腦開啟。</p>
      <span class="go">如何使用 <i>→</i></span>
    </button>
    <a class="block b-time" href="https://cj-z83xm4.github.io/meow-time-pawmodoro/">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2"/><path d="M9.500 3h5"/></svg></div>
      <h2>喵時光</h2><div class="en">Pawmodoro</div>
      <p>有貓咪陪你專注的番茄鐘，也記下喝水與休息。</p>
      <span class="go">開始陪我 <i>→</i></span>
    </a>
    <a class="block b-diary" href="https://personal-ai-os-8603a.web.app/">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.200-7-9.500A4 4 0 0 1 12 8a4 4 0 0 1 7 2.500C19 15.800 12 20 12 20z"/><path d="M7.500 12.500h2l1.200-2.300 1.800 4 1.200-1.700h2.800"/></svg></div>
      <h2>貓咪健康誌</h2><div class="en">Cat Health Diary</div>
      <p>記錄貓咪的健康與日常，一家人一起寫。</p>
      <span class="go">翻開日誌 <i>→</i></span>
    </a>
    <a class="block b-cafe" href="https://personal-ai-os-8603a.web.app/os/">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M5 10h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.500a2.500 2.500 0 0 1 0 5H16"/><path d="M9 3c-1 1.500 1 2.500 0 4M12.500 3c-1 1.500 1 2.500 0 4"/></svg></div>
      <h2>貓咖</h2><div class="en">Meow Café</div>
      <p>日常行程、記帳與旅行，由店長小花幫忙記。</p>
      <span class="go">走進貓咖 <i>→</i></span>
    </a>
  </div>
</main>
<dialog id="studioDlg">
  <h3>斑斑工作室是離線工具</h3>
  <ol>
    <li>工具放在你自己的電腦裡，不會上傳到網路。</li>
    <li>用瀏覽器直接打開「斑斑工作室.html」。</li>
    <li>填寫的內容只存在這台電腦的瀏覽器。</li>
  </ol>
  <button type="button" id="studioClose">知道了</button>
</dialog>
<footer><b>永遠愛你，斑斑</b></footer>
<script>
const R=document.documentElement,b=document.getElementById('theme');
b.onclick=()=>{const d=getComputedStyle(R).getPropertyValue('--bg').trim()==='#2a2019';R.setAttribute('data-theme',d?'light':'dark')};
const dlg=document.getElementById('studioDlg');
document.getElementById('studioBtn').onclick=()=>dlg.showModal();
document.getElementById('studioClose').onclick=()=>dlg.close();
</script>
